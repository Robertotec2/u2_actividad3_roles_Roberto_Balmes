<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1000" viewBox="0 0 1200 1000" font-family="DejaVu Sans, Arial, sans-serif">
  <rect width="1200" height="1000" fill="#ffffff"/>
  <text x="40" y="44" font-size="24" font-weight="bold" fill="#14202e">Boceto · Dashboard financiero (vista principal)</text>
  <text x="40" y="70" font-size="14" fill="#556274">Unidad III · Actividad 1 · Equipo: Roberto Balmes Solís, David Romero · Las cifras son de ejemplo: en la app salen de generalBalance</text>

  <!-- marco -->
  <rect x="40" y="90" width="1120" height="880" rx="12" fill="#f3f5f8" stroke="#8a95a5" stroke-width="2"/>

  <!-- 1 Encabezado -->
  <rect x="60" y="110" width="1080" height="90" rx="8" fill="#fff" stroke="#1f4e8c" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="76" y="132" font-size="13" font-weight="bold" fill="#1f4e8c">① ENCABEZADO</text>
  <text x="76" y="162" font-size="22" font-weight="bold" fill="#14202e">[Nombre de la empresa]</text>
  <text x="76" y="186" font-size="14" fill="#556274">RFC · Empresa #id · Moneda MXN</text>
  <text x="760" y="150" font-size="15" fill="#14202e">[Usuario]  [ROL]</text>
  <text x="760" y="172" font-size="13" fill="#556274">Sesión válida hasta HH:MM</text>
  <rect x="1010" y="160" width="115" height="30" rx="6" fill="#fff" stroke="#8a95a5"/>
  <text x="1022" y="180" font-size="13" fill="#14202e">Cerrar sesión</text>

  <!-- 2 Controles -->
  <rect x="60" y="215" width="1080" height="95" rx="8" fill="#fff" stroke="#1f4e8c" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="76" y="237" font-size="13" font-weight="bold" fill="#1f4e8c">② CONTROLES DEL PERÍODO</text>
  <text x="76" y="258" font-size="12" fill="#556274">Desde (fromDate)</text>
  <rect x="76" y="264" width="160" height="32" rx="6" fill="#fff" stroke="#8a95a5"/>
  <text x="88" y="285" font-size="13" fill="#556274">aaaa-mm-dd</text>
  <text x="252" y="258" font-size="12" fill="#556274">Hasta (toDate)</text>
  <rect x="252" y="264" width="160" height="32" rx="6" fill="#fff" stroke="#8a95a5"/>
  <text x="264" y="285" font-size="13" fill="#556274">aaaa-mm-dd</text>
  <rect x="428" y="264" width="110" height="32" rx="6" fill="#1f4e8c"/>
  <text x="446" y="285" font-size="14" font-weight="bold" fill="#fff">Actualizar</text>
  <text x="790" y="285" font-size="13" fill="#1f4e8c" text-decoration="underline">Este mes · Mes anterior · 26–30 oct 2026</text>
  <text x="560" y="285" font-size="12" fill="#9a3412">aviso si fromDate &gt; toDate</text>

  <text x="60" y="336" font-size="15" fill="#556274">Período consultado: <tspan font-weight="bold" fill="#14202e">[fromDate] al [toDate] · MXN</tspan>  (siempre visible, viene de la respuesta)</text>

  <!-- 3 Indicadores -->
  <rect x="60" y="352" width="1080" height="260" rx="8" fill="none" stroke="#1f4e8c" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="76" y="374" font-size="13" font-weight="bold" fill="#1f4e8c">③ INDICADORES GENERALES — “¿cómo va la empresa?”</text>
  <rect x="76" y="386" width="1048" height="100" rx="8" fill="#fff" stroke="#8a95a5"/>
  <rect x="76" y="386" width="7" height="100" fill="#1f4e8c"/>
  <text x="98" y="412" font-size="14" fill="#556274">Saldo final general (closingBalance) — el número más grande</text>
  <text x="98" y="458" font-size="38" font-weight="bold" fill="#14202e">$ 0,000.00</text>
  <text x="98" y="478" font-size="12" fill="#556274">Saldo inicial + profit · fondo rojo si es negativo</text>
  <g font-size="13">
    <rect x="76" y="500" width="250" height="98" rx="8" fill="#fff" stroke="#8a95a5"/>
    <text x="92" y="524" fill="#556274">Saldo inicial</text><text x="92" y="562" font-size="24" font-weight="bold" fill="#14202e">$ 0.00</text><text x="92" y="586" font-size="11" fill="#556274">openingBalance</text>
    <rect x="342" y="500" width="250" height="98" rx="8" fill="#fff" stroke="#8a95a5"/>
    <text x="358" y="524" fill="#556274">Ingresos</text><text x="358" y="562" font-size="24" font-weight="bold" fill="#17663a">$ 0.00</text><text x="358" y="586" font-size="11" fill="#556274">totalIncome</text>
    <rect x="608" y="500" width="250" height="98" rx="8" fill="#fff" stroke="#8a95a5"/>
    <text x="624" y="524" fill="#556274">Egresos</text><text x="624" y="562" font-size="24" font-weight="bold" fill="#9a3412">$ 0.00</text><text x="624" y="586" font-size="11" fill="#556274">totalExpense</text>
    <rect x="874" y="500" width="250" height="98" rx="8" fill="#fff" stroke="#8a95a5"/>
    <text x="890" y="524" fill="#556274">Profit</text><text x="890" y="562" font-size="24" font-weight="bold" fill="#14202e">$ 0.00</text><text x="890" y="586" font-size="11" fill="#556274">profit · negativo en naranja, no rojo</text>
  </g>

  <!-- 4 Riesgo -->
  <rect x="60" y="626" width="1080" height="110" rx="8" fill="none" stroke="#1f4e8c" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="76" y="648" font-size="13" font-weight="bold" fill="#1f4e8c">④ ESTADO DE RIESGO — general y cuentas por separado</text>
  <rect x="76" y="658" width="516" height="66" rx="8" fill="#e7f4ec" stroke="#a9d7b9"/>
  <text x="92" y="682" font-size="13" fill="#556274">¿Saldo general en rojo? (isInRed)</text>
  <text x="92" y="708" font-size="18" font-weight="bold" fill="#17663a">Sí / No</text>
  <rect x="608" y="658" width="516" height="66" rx="8" fill="#fdecea" stroke="#f1a7a0"/>
  <text x="624" y="682" font-size="13" fill="#556274">Cuentas en rojo (accountsInRed) + nombres</text>
  <text x="624" y="708" font-size="18" font-weight="bold" fill="#b42318">N cuentas · En rojo: [cuenta]</text>

  <!-- 5 Detalle -->
  <rect x="60" y="750" width="1080" height="200" rx="8" fill="#fff" stroke="#1f4e8c" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="76" y="772" font-size="13" font-weight="bold" fill="#1f4e8c">⑤ DETALLE POR CUENTA — “¿en qué cuenta?” (generalBalance.accounts)</text>
  <g font-size="12" fill="#556274" font-weight="bold">
    <text x="80" y="800">CUENTA</text><text x="250" y="800">SALDO INICIAL</text><text x="410" y="800">INGRESOS</text>
    <text x="560" y="800">EGRESOS</text><text x="710" y="800">PROFIT</text><text x="850" y="800">SALDO FINAL</text><text x="1010" y="800">ESTADO</text>
  </g>
  <line x1="76" y1="810" x2="1124" y2="810" stroke="#d9dee6"/>
  <g font-size="13" fill="#14202e">
    <text x="80" y="834">[Cuenta A]</text><text x="1010" y="834" fill="#17663a" font-weight="bold">OK</text>
    <line x1="76" y1="846" x2="1124" y2="846" stroke="#d9dee6"/>
    <rect x="76" y="847" width="1048" height="34" fill="#fdecea"/>
    <text x="80" y="869">[Cuenta B]</text><text x="850" y="869" fill="#b42318" font-weight="bold">−$ 0.00</text>
    <rect x="1008" y="855" width="62" height="20" rx="10" fill="#b42318"/><text x="1015" y="870" fill="#fff" font-size="12" font-weight="bold">En rojo</text>
    <line x1="76" y1="882" x2="1124" y2="882" stroke="#d9dee6"/>
    <text x="80" y="905">[Cuenta C] <tspan fill="#556274" font-size="11">(inactiva)</tspan></text><text x="1010" y="905" fill="#17663a" font-weight="bold">OK</text>
  </g>
  <text x="80" y="936" font-size="12" fill="#556274">Estado vacío: “La empresa todavía no tiene cuentas” / “No hubo movimientos entre … y …”. Error: “Acceso denegado” sin cifras.</text>
</svg>
